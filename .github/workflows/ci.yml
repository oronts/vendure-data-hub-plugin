name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:dashboard
      - run: npm run lint
      - run: npm run verify:i18n
      - run: npm run verify:docs
      - run: npm test
      - run: npm run build

  vendure-compatibility:
    name: Vendure ${{ matrix.vendure }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendure: 3.5.7
            typeorm: 0.3.29
            node: 20.x
          - vendure: 3.6.5
            typeorm: 0.3.31
            node: 22.x
          - vendure: 3.7.2
            typeorm: 0.3.31
            node: 24.x

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Verify package consumer
        env:
          DATA_HUB_TEST_VENDURE_VERSION: ${{ matrix.vendure }}
          DATA_HUB_TEST_TYPEORM_VERSION: ${{ matrix.typeorm }}
        run: npm run verify:package

  integration:
    name: Vendure E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci
      - run: npm run test:e2e

  infrastructure:
    name: Docker infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run test:infrastructure:redis
      - run: npm run test:infrastructure:otlp
      - run: npm run test:infrastructure:external

  release-contract:
    name: Generated, package, and supply-chain contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci
      - run: npm run i18n:extract
      - run: npm run codegen
      - run: git diff --exit-code
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run verify:package
      - run: npm sbom --omit=dev --sbom-format=spdx --sbom-type=library > data-hub.spdx.json
