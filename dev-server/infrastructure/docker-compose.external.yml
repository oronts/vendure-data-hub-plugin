services:
  rabbitmq:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: datahub
      RABBITMQ_DEFAULT_PASS: datahub-password
      RABBITMQ_DEFAULT_VHOST: datahub
    ports:
      - "127.0.0.1:${DATAHUB_TEST_RABBITMQ_PORT:?DATAHUB_TEST_RABBITMQ_PORT is required}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: datahub
      MINIO_ROOT_PASSWORD: datahub-secret-key
    ports:
      - "127.0.0.1:${DATAHUB_TEST_S3_PORT:?DATAHUB_TEST_S3_PORT is required}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/lib/postgresql/tls
        cp /datahub-certs/ca.pem /var/lib/postgresql/tls/ca.pem
        cp /datahub-certs/server-cert.pem /var/lib/postgresql/tls/server-cert.pem
        cp /datahub-certs/server-key.pem /var/lib/postgresql/tls/server-key.pem
        chown -R postgres:postgres /var/lib/postgresql/tls
        chmod 0700 /var/lib/postgresql/tls
        chmod 0644 /var/lib/postgresql/tls/ca.pem /var/lib/postgresql/tls/server-cert.pem
        chmod 0600 /var/lib/postgresql/tls/server-key.pem
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_ca_file=/var/lib/postgresql/tls/ca.pem \
          -c ssl_cert_file=/var/lib/postgresql/tls/server-cert.pem \
          -c ssl_key_file=/var/lib/postgresql/tls/server-key.pem
    environment:
      POSTGRES_DB: datahub
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub-password
    ports:
      - "127.0.0.1:${DATAHUB_TEST_POSTGRES_PORT:?DATAHUB_TEST_POSTGRES_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub -d datahub"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - "${DATAHUB_EXTERNAL_CERT_DIR:?Set DATAHUB_EXTERNAL_CERT_DIR}:/datahub-certs:ro"
      - "./postgres-tls-init.sh:/docker-entrypoint-initdb.d/10-require-client-cert.sh:ro"

  mysql:
    image: mysql:8.4@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /var/lib/mysql-tls
        cp /datahub-certs/ca.pem /var/lib/mysql-tls/ca.pem
        cp /datahub-certs/server-cert.pem /var/lib/mysql-tls/server-cert.pem
        cp /datahub-certs/server-key.pem /var/lib/mysql-tls/server-key.pem
        chown -R mysql:mysql /var/lib/mysql-tls
        chmod 0700 /var/lib/mysql-tls
        chmod 0644 /var/lib/mysql-tls/ca.pem /var/lib/mysql-tls/server-cert.pem
        chmod 0600 /var/lib/mysql-tls/server-key.pem
        exec /usr/local/bin/docker-entrypoint.sh mysqld \
          --require-secure-transport=ON \
          --ssl-ca=/var/lib/mysql-tls/ca.pem \
          --ssl-cert=/var/lib/mysql-tls/server-cert.pem \
          --ssl-key=/var/lib/mysql-tls/server-key.pem
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub-password
      MYSQL_ROOT_PASSWORD: datahub-root-password
    ports:
      - "127.0.0.1:${DATAHUB_TEST_MYSQL_PORT:?DATAHUB_TEST_MYSQL_PORT is required}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=socket -u root -pdatahub-root-password --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - "${DATAHUB_EXTERNAL_CERT_DIR:?Set DATAHUB_EXTERNAL_CERT_DIR}:/datahub-certs:ro"
      - "./mysql-tls-init.sql:/docker-entrypoint-initdb.d/10-require-client-cert.sql:ro"

  ftp:
    image: delfer/alpine-ftp-server@sha256:60bb774d8408d9d4d5c74d05d1c086a34ce192c6c1a142ffac268cac0dbc6fac
    environment:
      USERS: "datahub|datahub-password|/home/datahub"
      ADDRESS: "127.0.0.1"
      MIN_PORT: "${DATAHUB_TEST_FTP_PASSIVE_MIN:?DATAHUB_TEST_FTP_PASSIVE_MIN is required}"
      MAX_PORT: "${DATAHUB_TEST_FTP_PASSIVE_MAX:?DATAHUB_TEST_FTP_PASSIVE_MAX is required}"
    ports:
      - "127.0.0.1:${DATAHUB_TEST_FTP_PORT:?DATAHUB_TEST_FTP_PORT is required}:21"
      - "127.0.0.1:${DATAHUB_TEST_FTP_PASSIVE_MIN}-${DATAHUB_TEST_FTP_PASSIVE_MAX}:${DATAHUB_TEST_FTP_PASSIVE_MIN}-${DATAHUB_TEST_FTP_PASSIVE_MAX}"

  sftp:
    image: atmoz/sftp@sha256:81fa92512bf8ead4849f33c1c153907b86d32d77704d1c62a9c70b4316ae9e50
    command: "datahub:datahub-password:1001::upload"
    ports:
      - "127.0.0.1:${DATAHUB_TEST_SFTP_PORT:?DATAHUB_TEST_SFTP_PORT is required}:22"

volumes:
  minio-data:
